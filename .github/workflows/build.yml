on:
  push:
    branches:
      - '*'
  workflow_dispatch:

name: Linux_Container_Node_Workflow

jobs:
  test-mvn-install:
    runs-on: ubuntu-24.04
    steps:

      - name: 'Checkout Github Action'
        uses: actions/checkout@master

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: build jar
        run: mvn clean install

  build-and-deploy:
    runs-on: ubuntu-24.04
    needs: test-mvn-install
    if: github.ref == 'refs/heads/develop'
    steps:

      - name: 'Checkout Github Action'
        uses: actions/checkout@master

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: build jar
        run: mvn clean install

      - name: 'Login via Azure CLI'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - run: |
          docker build -t ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_IMAGE }}:${{ github.sha }} .
          docker push ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_IMAGE }}:${{ github.sha }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.APP_SERVICE_NAME }}
          images: '${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_IMAGE }}:${{ github.sha }}'

      - name: Azure logout
        run: |
          az logout
